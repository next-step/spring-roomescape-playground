<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>방탈출 어드민 페이지</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/reservation.css" rel="stylesheet">
    <style>
        .time-badge {
            display: inline-flex;
            align-items: center;
            background-color: #f8f9fa;
            color: #495057;
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
            border: 1px solid #ced4da;
        }

        .time-badge .delete-time-btn {
            margin-left: 0.6rem;
            color: #dc3545;
            cursor: pointer;
            font-weight: bold;
        }

        .time-badge .delete-time-btn:hover {
            color: #bd2130;
        }
    </style>
</head>

<body>

<div class="container-fluid page">
    <div class="row">
        <div class="col-md-3" id="sidebar-container">
            <nav class="text-white" id="sidebar">
                <div class="sidebar-logo p-4">
                    <a href="/">
                        <img alt="logo" class="img-fluid rounded-circle"
                             src="https://avatars.githubusercontent.com/u/141792611?s=96&v=4">
                    </a>
                </div>
                <ul class="list-unstyled mt-4">
                    <li class="p-3">
                        <i class="fas fa-calendar-check menu-icon mr-2"></i>
                        <a class="text-white" href="/reservation">예약관리</a>
                    </li>
                    <li class="p-3">
                        <i class="fas fa-clock menu-icon mr-2"></i>
                        <a class="text-white" href="/time">시간관리</a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="col-md-9 p-5" id="content-container">
            <h1>예약 관리</h1>

            <div class="card p-4 mb-4 bg-light border">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <button class="btn btn-primary font-weight-bold" id="add-reservation">
                        <i class="fas fa-plus mr-1"></i> 예약 추가
                    </button>

                    <div class="form-inline">
                        <label class="font-weight-bold mr-2"><i class="fas fa-plus-circle text-success mr-1"></i>예약 가용
                            시간 추가 :</label>
                        <input class="form-control mr-2" id="new-available-time" step="3600" type="time">
                        <button class="btn btn-success font-weight-bold" id="submit-new-time">등록</button>
                    </div>
                </div>
                <hr class="my-2">
                <div>
          <span class="font-weight-bold text-muted d-block mb-2" style="font-size: 0.85rem;">
            <i class="fas fa-trash-alt text-danger mr-1"></i> 시스템 등록 시간대 풀 (클릭 시 가용지에서 즉시 삭제) :
          </span>
                    <div class="d-flex flex-wrap" id="available-times-container">
                        <small class="text-secondary">시간 로딩 중...</small>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>예약번호</th>
                        <th>예약자</th>
                        <th>날짜</th>
                        <th>시간</th>
                        <th>작업</th>
                    </tr>
                    </thead>
                    <tbody id="reservation-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/js/scripts.js"></script>
<script src="/js/new-reservation.js"></script>
</body>

</html>
