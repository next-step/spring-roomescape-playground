<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 방탈출</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
        }

        .reservation-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 15px 0;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .header-link {
            color: #6c757d;
            text-decoration: none;
            font-size: 16px;
            margin-left: 20px;
        }

        .header-link:hover {
            color: #333;
            text-decoration: none;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 71px);
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            font-weight: 400;
            color: #000;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .login-form {
            width: 100%;
            max-width: 400px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 18px 24px;
            font-size: 16px;
            border: none;
            background-color: #e3ecf5;
            border-radius: 6px;
            outline: none;
            color: #333;
            letter-spacing: 0.3px;
        }

        input[type="password"] {
            letter-spacing: 3px;
        }

        input::placeholder {
            color: #666;
            letter-spacing: 0.3px;
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 35px;
        }

        button {
            flex: 1;
            padding: 16px;
            font-size: 17px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-signup {
            background-color: white;
            color: #333;
            border: 2px solid #d0d0d0;
        }

        .btn-signup:hover {
            border-color: #a0a0a0;
            background-color: #fafafa;
        }

        .btn-login {
            background-color: #0a4d1a;
            color: white;
            border: 2px solid #0a4d1a;
        }

        .btn-login:hover {
            background-color: #084015;
            border-color: #084015;
        }
    </style>
</head>
<body>

<header class="reservation-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="header-left">
            <a href="/" class="logo-link">
                <img src="https://avatars.githubusercontent.com/u/141792611?s=96&v=4" alt="logo" class="header-logo">
            </a>
        </div>

        <div class="header-right d-flex align-items-center">
            <a href="/reservation" class="header-link">Reservation</a>
            <a href="/login" class="header-link">Login</a>
        </div>
    </div>
</header>

<div class="login-container">
    <h1>Login</h1>
    <form id="login-form" class="login-form">
        <div class="input-group">
            <input
                    type="email"
                    id="email"
                    value="admin@email.com"
                    required
                    placeholder="Email"
            >
        </div>
        <div class="input-group">
            <input
                    type="password"
                    id="password"
                    value="password"
                    required
                    placeholder="Password"
            >
        </div>
        <div class="button-group">
            <button type="button" class="btn-signup">
                Sign Up
            </button>
            <button type="submit" class="btn-login">
                Login
            </button>
        </div>
    </form>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                window.location.href = '/';
            } else {
                const errorMessage = await response.text();
                alert('로그인 실패: ' + errorMessage);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('로그인 중 오류가 발생했습니다.');
        }
    });
</script>
</body>
</html>
